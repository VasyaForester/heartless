<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trail photo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#222; }
  main { width:1200px; height:1000px; position:relative; overflow:hidden; background:linear-gradient(180deg, #cfe0c2 0%, #b9cfa5 34%, #a7c08e 58%, #8fae77 100%); }
  .bokeh { position:absolute; border-radius:50%; filter:blur(22px); opacity:.55; }
  .b1 { width:280px; height:280px; left:-40px; top:60px; background:#d9e8c8; }
  .b2 { width:230px; height:230px; right:-30px; top:140px; background:#cfe3ba; opacity:.5; }
  .b3 { width:340px; height:340px; left:120px; bottom:-80px; background:#9fbc85; opacity:.6; }
  .b4 { width:200px; height:200px; right:80px; bottom:40px; background:#b8d29e; opacity:.45; }
  .b5 { width:150px; height:150px; left:56%; top:36%; background:#e6f0d8; opacity:.35; }
  .sun { position:absolute; inset:0; background:radial-gradient(600px 500px at 68% 12%, rgba(255,250,220,.55), rgba(255,250,220,0) 70%); }
  .vignette { position:absolute; inset:0; background:radial-gradient(120% 100% at 50% 46%, rgba(0,0,0,0) 58%, rgba(20,30,10,.22) 100%); }
  .plantwrap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); filter:saturate(1.06) contrast(1.03) drop-shadow(0 18px 22px rgba(30,50,15,.35)); }
  svg { display:block; filter:blur(.35px); }
  .grain { position:absolute; inset:0; opacity:.05; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="120" height="120" filter="url(%23n)" opacity="0.6"/></svg>'); }
</style>
</head>
<body>
<main>
  <div class="sun"></div>
  <div class="bokeh b1"></div><div class="bokeh b2"></div><div class="bokeh b3"></div><div class="bokeh b4"></div><div class="bokeh b5"></div>
  <div class="plantwrap">
  <svg width="520" height="700" viewBox="0 0 640 860" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#3f6127"/><stop offset=".5" stop-color="#5b8038"/><stop offset="1" stop-color="#334f1f"/>
      </linearGradient>
      <radialGradient id="bell" cx=".4" cy=".35" r=".9">
        <stop offset="0" stop-color="#c890d8"/><stop offset=".55" stop-color="#a468bd"/><stop offset="1" stop-color="#7d4a97"/>
      </radialGradient>
      <radialGradient id="bell2" cx=".45" cy=".4" r=".95">
        <stop offset="0" stop-color="#d3a2e2"/><stop offset=".6" stop-color="#ad73c6"/><stop offset="1" stop-color="#8860a5"/>
      </radialGradient>
      <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6f9a44"/><stop offset="1" stop-color="#4d7330"/>
      </linearGradient>
    </defs>
    <!-- stem -->
    <path d="M320 856 C 317 640, 323 380, 320 60" stroke="url(#stem)" stroke-width="15" fill="none"/>
    <!-- leaves with vein -->
    <g>
      <g transform="translate(320,788)"><path d="M0 0 C -58 -12, -96 -44, -104 -86 C -62 -96, -14 -76, 0 -40 Z" fill="url(#leaf)" stroke="#3c5c25" stroke-width="2"/><path d="M-4 -12 C -40 -24, -74 -50, -92 -78" stroke="#3c5c25" stroke-width="1.6" fill="none" opacity=".7"/></g>
      <g transform="translate(322,704)"><path d="M-2 0 C 60 -14, 100 -48, 108 -92 C 64 -102, 16 -80, -2 -42 Z" fill="url(#leaf)" stroke="#3c5c25" stroke-width="2"/><path d="M4 -14 C 42 -26, 78 -54, 96 -82" stroke="#3c5c25" stroke-width="1.6" fill="none" opacity=".7"/></g>
      <g transform="translate(320,618)"><path d="M0 0 C -60 -12, -98 -44, -106 -88 C -64 -98, -16 -78, 0 -42 Z" fill="url(#leaf)" stroke="#3c5c25" stroke-width="2"/></g>
      <g transform="translate(322,532)"><path d="M-2 0 C 58 -14, 96 -46, 104 -90 C 62 -100, 14 -78, -2 -42 Z" fill="url(#leaf)" stroke="#3c5c25" stroke-width="2"/></g>
      <g transform="translate(320,450)"><path d="M0 0 C -56 -12, -90 -42, -98 -82 C -58 -92, -14 -72, 0 -40 Z" fill="url(#leaf)" stroke="#3c5c25" stroke-width="2"/></g>
      <g transform="translate(322,372)"><path d="M-2 0 C 54 -12, 90 -42, 98 -82 C 58 -92, 12 -72, -2 -40 Z" fill="url(#leaf)" stroke="#3c5c25" stroke-width="2"/></g>
    </g>
    <!-- raceme of bells -->
    <g transform="translate(320,64)">
      <g fill="url(#bell)" stroke="#6d3f85" stroke-width="2">
        <path d="M0 4 c -30 -8, -52 6, -56 26 c 14 14, 40 16, 56 5 z"/>
      </g>
      <g transform="translate(2,52)" fill="url(#bell2)" stroke="#6d3f85" stroke-width="2">
        <path d="M0 4 c 30 -8, 52 6, 56 26 c -14 14, -40 16, -56 5 z"/>
      </g>
      <g transform="translate(-2,102)" fill="url(#bell)" stroke="#6d3f85" stroke-width="2">
        <path d="M0 4 c -30 -8, -52 6, -56 26 c 14 14, 40 16, 56 5 z"/>
      </g>
      <g transform="translate(2,152)" fill="url(#bell2)" stroke="#6d3f85" stroke-width="2">
        <path d="M0 4 c 30 -8, 52 6, 56 26 c -14 14, -40 16, -56 5 z"/>
      </g>
      <g transform="translate(-1,198)" fill="url(#bell)" stroke="#6d3f85" stroke-width="2" opacity=".95">
        <path d="M0 4 c -26 -7, -44 5, -48 22 c 12 12, 34 14, 48 4 z"/>
      </g>
      <g transform="translate(1,236)" fill="url(#bell2)" stroke="#6d3f85" stroke-width="2" opacity=".9">
        <path d="M0 4 c 22 -6, 38 4, 42 18 c -10 10, -30 12, -42 4 z"/>
      </g>
      <circle cx="0" cy="-16" r="7" fill="#caa0da"/>
      <circle cx="3" cy="-33" r="6" fill="#d4aff0"/>
      <circle cx="-2" cy="-48" r="5" fill="#dcbdf3"/>
    </g>
  </svg>
  </div>
  <div class="grain"></div>
  <div class="vignette"></div>
</main>
</body>
</html>
