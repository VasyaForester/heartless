<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trail photo — plant</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#e8e6df; }
  main { width:1200px; height:1000px; display:flex; align-items:center; justify-content:center; background:#dcdacf; }
  svg { box-shadow:0 2px 14px rgba(0,0,0,0.25); background:#f2efe6; }
</style>
</head>
<body>
<main>
<svg width="820" height="920" viewBox="0 0 820 920" xmlns="http://www.w3.org/2000/svg">
  <!-- sky/backdrop -->
  <rect x="0" y="0" width="820" height="920" fill="#f2efe6"/>
  <!-- stem -->
  <path d="M400 900 C 398 700, 404 420, 400 120" stroke="#4a6b2d" stroke-width="14" fill="none"/>
  <!-- leaves (alternating, lanceolate, serrated edge suggestion) -->
  <g fill="#5d8a37" stroke="#41702a" stroke-width="3">
    <path d="M400 840 C 340 830, 300 800, 292 760 C 330 750, 380 770, 400 800 Z"/>
    <path d="M400 770 C 470 755, 512 720, 520 676 C 476 668, 428 694, 400 730 Z"/>
    <path d="M400 690 C 335 678, 296 645, 288 600 C 330 590, 382 614, 400 648 Z"/>
    <path d="M402 606 C 468 590, 508 556, 514 512 C 470 504, 424 530, 402 566 Z"/>
    <path d="M400 520 C 340 508, 304 476, 298 432 C 336 424, 384 446, 400 480 Z"/>
    <path d="M402 438 C 464 424, 500 392, 506 350 C 464 342, 424 366, 402 400 Z"/>
  </g>
  <!-- racemes with purple tubular bells (foxglove) -->
  <g>
    <g transform="translate(400,120)">
      <g fill="#9b59b6" stroke="#7d3c98" stroke-width="2">
        <path d="M0 0 c -26 -6, -46 6, -50 22 c 12 12, 36 14, 50 4 z"/>
        <path d="M0 40 c 26 -6, 46 6, 50 22 c -12 12, -36 14, -50 4 z"/>
        <path d="M0 80 c -26 -6, -46 6, -50 22 c 12 12, 36 14, 50 4 z"/>
        <path d="M0 120 c 26 -6, 46 6, 50 22 c -12 12, -36 14, -50 4 z"/>
        <path d="M0 160 c -24 -5, -42 6, -46 20 c 11 11, 33 13, 46 4 z"/>
        <path d="M0 196 c 20 -5, 36 4, 40 16 c -9 10, -28 12, -40 4 z"/>
      </g>
      <circle cx="0" cy="-14" r="7" fill="#bc8ad3"/>
      <circle cx="2" cy="-30" r="6" fill="#c79ade"/>
      <circle cx="-2" cy="-44" r="5" fill="#d0a8e3"/>
    </g>
    <g transform="translate(400,120) scale(0.9)">
      <g fill="#a569c8" stroke="#8b4bb0" stroke-width="2" opacity="0.85">
        <path d="M-8 20 c -22 -5, -38 5, -42 18 c 10 10, 30 12, 42 3 z"/>
        <path d="M-8 58 c 22 -5, 38 5, 42 18 c -10 10, -30 12, -42 3 z"/>
        <path d="M-6 96 c -22 -5, -38 5, -42 18 c 10 10, 30 12, 42 3 z"/>
      </g>
    </g>
  </g>
  <!-- ground -->
  <ellipse cx="400" cy="902" rx="330" ry="26" fill="#c9c4b2"/>
</svg>
</main>
</body>
</html>
