<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#c9cdd2; }
  main { width:900px; height:1100px; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#d8dce0,#b9bec4); }
  svg { filter: drop-shadow(0 10px 16px rgba(0,0,0,.3)); }
</style>
</head>
<body>
<main>
<svg width="520" height="900" viewBox="0 0 520 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef3f5" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#cfdde2" stop-opacity=".85"/>
      <stop offset=".65" stop-color="#b9ccd2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#e6eef1" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfb"/>
      <stop offset="1" stop-color="#e8e6df"/>
    </linearGradient>
  </defs>
  <!-- vial body -->
  <g transform="translate(140,150)">
    <path d="M120 40 L120 90 Q120 120 90 150 L90 640 Q90 700 120 700 Q150 700 150 640 L150 150 Q120 120 120 90 Z" fill="url(#glass)" stroke="#8fa3aa" stroke-width="3"/>
    <!-- liquid -->
    <rect x="96" y="420" width="48" height="270" rx="10" fill="url(#liquid)" stroke="#c8c4b8" stroke-width="2"/>
    <!-- crimp cap -->
    <rect x="92" y="14" width="56" height="34" rx="8" fill="#b9c3c9" stroke="#7c8a92" stroke-width="3"/>
    <rect x="104" y="2" width="32" height="18" rx="6" fill="#aab6bd" stroke="#7c8a92" stroke-width="2"/>
    <!-- label -->
    <rect x="70" y="200" width="100" height="170" rx="6" fill="#ffffff" stroke="#9aa8ae" stroke-width="2" transform="rotate(-4 120 285)"/>
    <text x="120" y="242" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1c2a33" transform="rotate(-4 120 285)">BOTOX®</text>
    <text x="120" y="272" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#3a4a55" transform="rotate(-4 120 285)">Botulinum toxin</text>
    <text x="120" y="292" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#3a4a55" transform="rotate(-4 120 285)">type A complex</text>
    <text x="120" y="322" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6a7a85" transform="rotate(-4 120 285)">100 Units</text>
    <text x="120" y="344" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#8a9aa5" transform="rotate(-4 120 285)">for investigational use</text>
    <!-- glass shine -->
    <path d="M100 160 L100 620" stroke="#ffffff" stroke-opacity=".7" stroke-width="6"/>
  </g>
</svg>
</main>
</body>
</html>
