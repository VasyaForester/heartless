<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Netflix — Sign In</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: Helvetica, Arial, sans-serif; }
  html,body { background:#000; color:#fff; }
  main { width:1600px; height:1000px; position:relative; }
  .top { padding:28px 56px; }
  .logo { color:#e50914; font-size:44px; font-weight:bold; letter-spacing:-1px; font-family: Impact, 'Arial Black', sans-serif; }
  .card { width:480px; margin:40px auto 0; background:rgba(0,0,0,0.75); border-radius:8px; padding:56px 64px; }
  .card h1 { font-size:32px; margin-bottom:28px; }
  input { width:100%; height:52px; margin-bottom:18px; padding:0 18px; border-radius:5px; border:0; background:#333; color:#fff; font-size:17px; }
  .btn { width:100%; height:52px; margin-top:8px; border-radius:5px; border:0; background:#e50914; color:#fff; font-size:18px; font-weight:bold; cursor:pointer; }
  .row { display:flex; justify-content:space-between; margin-top:14px; font-size:14px; color:#b3b3b3; }
  .foot { position:absolute; bottom:40px; left:56px; right:56px; color:#757575; font-size:13px; }
  .foot a { color:#757575; text-decoration:none; margin-right:18px; }
</style>
</head>
<body>
<main>
  <div class="top"><div class="logo">NETFLIX</div></div>
  <div class="card">
    <h1>Sign In</h1>
    <input type="text" placeholder="Email or mobile number" value="">
    <input type="password" placeholder="Password" value="">
    <button class="btn">Sign In</button>
    <div class="row"><span>Remember me</span><span>Need help?</span></div>
  </div>
  <div class="foot">
    <a>Questions? Call 1-844-505-2993</a>
    <div style="margin-top:18px">
      <a>FAQ</a><a>Help Centre</a><a>Terms of Use</a><a>Privacy</a><a>Cookie Preferences</a>
    </div>
  </div>
</main>
</body>
</html>
